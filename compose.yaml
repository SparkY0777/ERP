services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_DB: school_erp
      POSTGRES_USER: erp
      POSTGRES_PASSWORD: local-demo-only
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U erp -d school_erp"]
      interval: 5s
      timeout: 5s
      retries: 10
volumes:
  postgres_data:
